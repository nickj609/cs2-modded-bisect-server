    version: "1.11"
    module: Advanced Weapon System
    paths: [addons/counterstrikesharp/plugins/disabled/cs2-advanced-weapon-system/]
    configs: [addons/counterstrikesharp/configs/plugins/cs2-advanced-weapon-system/]
    notes: Repository moved to an archive organisation (no longer maintained). Look for a replacement.

  - name: cs2-OneInTheChamber
    kind: plugin
    source: { github: ShookEagle/cs2-OneInTheChamber }
    version: 1.0.0
    module: OneInTheChamber
    paths: [addons/counterstrikesharp/plugins/disabled/cs2-OneInTheChamber/]

  - name: cs2-quake-sounds
    kind: plugin
    source: { github: Kandru/cs2-quake-sounds }
    version: "26.08.1"
    module: CS2 QuakeSounds
    paths: [addons/counterstrikesharp/plugins/disabled/QuakeSounds/]
    configs: [addons/counterstrikesharp/configs/plugins/QuakeSounds/]

  - name: CS2-WeaponSpeed
    kind: plugin
    source: { github: akanora/CS2-WeaponSpeed }
    version: "1.3"
    module: Weapon Speed
    paths: [addons/counterstrikesharp/plugins/disabled/WeaponSpeed/]
    configs: [addons/counterstrikesharp/configs/plugins/WeaponSpeed/]

  - name: SpectatorList-CS2
    kind: plugin
    source: { github: srwiruwiru/SpectatorList-CS2 }
    version: "16"
    module: SpectatorList
    requires: [PlayerSettings]
    paths: [addons/counterstrikesharp/plugins/disabled/SpectatorList/]
    configs: [addons/counterstrikesharp/configs/plugins/SpectatorList/]
    notes: README says 16 (release tag); the DLL reports 1.0.5.

