    keep:
      - addons/counterstrikesharp/plugins/disabled/GameModifiers/ConVarModifiers/**
      - addons/counterstrikesharp/plugins/disabled/GameModifiers/ModifierConfig/**
    notes: README says 1.0.4; the installed DLL is 1.0.3.

  - name: CS2FunMatchPlugin
    kind: plugin
    source: { github: TitaniumLithium/CS2FunMatchPlugin }
    version: 1.1.1
    module: Fun Match Plugin
    paths: [addons/counterstrikesharp/plugins/disabled/FunMatchPlugin/]

  - name: RollTheDice
    kind: plugin
    source: { github: Kandru/cs2-roll-the-dice }
    version: "26.10.12"
    module: Roll The Dice
    paths: [addons/counterstrikesharp/plugins/disabled/RollTheDice/]
    configs: [addons/counterstrikesharp/configs/plugins/RollTheDice/]

  - name: CS2-MutualScoringPlayers
    kind: plugin
    source: { github: qstage/CS2-MutualScoringPlayers }
    version: 1.0.3
    module: MutualScoringPlayers
    paths: [addons/counterstrikesharp/plugins/disabled/MutualScoringPlayers/]

  - name: CS2WarcraftMod
    kind: plugin
    source: { github: Wngui/CS2WarcraftMod }
    version: 3.3.5
    module: Warcraft
    paths: [addons/counterstrikesharp/plugins/disabled/WarcraftPlugin/]

  - name: cs2-advanced-weapon-system
